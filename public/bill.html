<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Bill</title>

  <style>
    :root {
      --bg: #f5f5f7;
      --card: rgba(255,255,255,.9);
      --text: #1d1d1f;
      --muted: #86868b;
      --line: rgba(0,0,0,.08);
      --blue: #0071e3;
      --green: #34c759;
      --red: #ff3b30;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "SF Pro Text", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 5%, rgba(0,113,227,.07), transparent 32%),
        radial-gradient(circle at 90% 20%, rgba(52,199,89,.06), transparent 28%),
        var(--bg);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 18px 60px;
    }

    .page {
      width: min(100%, 520px);
      animation: appear .55s ease both;
    }

    .top {
      text-align: center;
      margin-bottom: 22px;
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 14px;
      border-radius: 19px;
      display: grid;
      place-items: center;
      background: #1d1d1f;
      color: white;
      font-size: 28px;
      box-shadow: 0 10px 28px rgba(0,0,0,.12);
    }

    .top h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: -.045em;
      font-weight: 700;
    }

    .top p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: var(--card);
      box-shadow: 0 18px 55px rgba(0,0,0,.08);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .receipt-head {
      padding: 26px 28px 22px;
      border-bottom: 1px solid var(--line);
    }

    .receipt-meta {
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .meta-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: 5px;
    }

    .meta-value {
      font-size: 14px;
      font-weight: 600;
    }

    .items {
      max-height: 300px;
      overflow-y: auto;
      padding: 8px 28px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 17px 0;
      border-bottom: 1px solid var(--line);
    }

    .item:last-child {
      border-bottom: 0;
    }

    .item-name {
      font-size: 15px;
      font-weight: 600;
    }

    .item-qty {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .item-price {
      font-size: 15px;
      font-weight: 650;
      white-space: nowrap;
    }

    .summary {
      padding: 22px 28px 26px;
      border-top: 1px solid var(--line);
      background: rgba(242,242,247,.45);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 7px 0;
      color: #515154;
      font-size: 14px;
    }

    .summary-row.total-row {
      margin-top: 10px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
      color: var(--text);
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -.03em;
    }

    .customer {
      margin-top: 18px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 25px;
      background: rgba(255,255,255,.86);
      box-shadow: 0 10px 30px rgba(0,0,0,.04);
    }

    .customer h2 {
      margin: 0 0 5px;
      font-size: 20px;
      letter-spacing: -.03em;
    }

    .customer p {
      margin: 0 0 17px;
      color: var(--muted);
      font-size: 13px;
    }

    .field {
      margin-top: 10px;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 15px;
      border: 1px solid rgba(0,0,0,.1);
      border-radius: 14px;
      outline: none;
      background: #f9f9fb;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    input:focus {
      background: white;
      border-color: rgba(0,113,227,.55);
      box-shadow: 0 0 0 4px rgba(0,113,227,.1);
    }

    button {
      width: 100%;
      height: 50px;
      margin-top: 14px;
      border: 0;
      border-radius: 15px;
      background: var(--blue);
      color: white;
      cursor: pointer;
      font: inherit;
      font-size: 15px;
      font-weight: 650;
      box-shadow: 0 8px 20px rgba(0,113,227,.2);
      transition: transform .2s, opacity .2s, box-shadow .2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(0,113,227,.25);
    }

    button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .warning {
      display: none;
      margin-top: 10px;
      padding: 11px 13px;
      border-radius: 12px;
      background: rgba(255,59,48,.08);
      color: var(--red);
      font-size: 13px;
      font-weight: 600;
    }

    .success {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      background: rgba(52,199,89,.1);
      color: #248a3d;
      font-size: 13px;
      font-weight: 650;
    }

    .spinner {
      width: 16px;
      height: 16px;
      display: inline-block;
      vertical-align: -3px;
      margin-right: 7px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      body { padding: 22px 12px 40px; }
      .top h1 { font-size: 28px; }
      .receipt-head, .summary, .items { padding-left: 20px; padding-right: 20px; }
      .customer { padding: 19px; }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="top">
      <div class="logo">🛒</div>
      <h1>Smart Bill</h1>
      <p>Your digital shopping receipt</p>
    </header>

    <section class="card">
      <div class="receipt-head">
        <div class="receipt-meta">
          <div>
            <span class="meta-label">Bill ID</span>
            <span id="billId" class="meta-value"></span>
          </div>
          <div style="text-align:right">
            <span class="meta-label">Date</span>
            <span id="date" class="meta-value"></span>
          </div>
        </div>
      </div>

      <div class="items" id="items"></div>

      <div class="summary">
        <div id="subtotal" class="summary-row"></div>
        <div id="gst" class="summary-row"></div>
        <div id="total" class="summary-row total-row"></div>
      </div>
    </section>

    <section class="customer">
      <h2>Send your receipt</h2>
      <p>Enter your details to receive the bill on WhatsApp.</p>

      <div class="field">
        <input id="name" placeholder="Customer name" autocomplete="name">
      </div>

      <div class="field">
        <input id="phone" placeholder="10-digit WhatsApp number"
               inputmode="numeric" autocomplete="tel">
      </div>

      <div id="warning" class="warning"></div>

      <button id="sendBtn" onclick="send()">Send Bill on WhatsApp</button>

      <div class="success" id="msg">✓ Bill sent successfully</div>
    </section>

    <div class="footer">Smart Trolley · Intelligent shopping, simplified.</div>

  </main>

  <script>
const id = window.location.pathname.split("/").pop();

fetch(`/api/bill/${id}`)
.then(res => res.json())
.then(data => {

  document.getElementById("billId").innerText = "Bill ID: " + data.id;
  document.getElementById("date").innerText = new Date(data.time).toLocaleString();

  let subtotal = 0;

  data.items.forEach(i => {
    let mrp = i.price;
    let mart = mrp * 0.95;
    let total = mart * i.qty;

    document.getElementById("items").innerHTML += `
      <div class="item">
        <div>
          <div class="item-name">${i.name}</div>
          <div class="item-qty">Quantity · ${i.qty}</div>
        </div>
        <span class="item-price">₹${total.toFixed(2)}</span>
      </div>
    `;

    subtotal += total;
  });

  let gst = subtotal * 0.05;
  let total = subtotal + gst;

  document.getElementById("subtotal").innerText = "Subtotal: ₹" + subtotal.toFixed(2);
  document.getElementById("gst").innerText = "GST: ₹" + gst.toFixed(2);
  document.getElementById("total").innerText = "Total: ₹" + total.toFixed(2);
});

function send(){

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();

  const warning = document.getElementById("warning");
  const btn = document.getElementById("sendBtn");

  if(name === ""){
    warning.innerText = "⚠ Enter customer name";
    warning.style.display = "block";
    return;
  }

  if(phone === ""){
    warning.innerText = "⚠ Enter WhatsApp number";
    warning.style.display = "block";
    return;
  }

  if(!/^[0-9]{10}$/.test(phone)){
    warning.innerText = "⚠ Invalid number";
    warning.style.display = "block";
    return;
  }

  warning.style.display = "none";

  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>Sending...`;

  fetch("/api/send-whatsapp",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      id: id,
      phone: phone,
      name: name
    })
  })
  .then(()=>{
    document.getElementById("msg").style.display="block";

    // 🔥 REDIRECT
    setTimeout(() => {
      window.location.href = "/admin";
    }, 1500);
  })
  .catch(()=>{
    warning.innerText = "❌ Failed to send";
    warning.style.display = "block";
  })
  .finally(()=>{
    btn.disabled = false;
    btn.innerHTML = "Send Bill";
  });
}
</script>
</body>
</html>
